<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LGVIBE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--b:#4361EE;--c:#38BDF8;--bg:#DCE9FB;--card:#fff;--ink:#1B2559;--mut:#7C88B1;--soft:#EEF3FF;--ok:#16A34A;--bad:#DC2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1630;--card:#18224A;--ink:#EAF0FF;--mut:#97A6D6;--soft:#222E5E}}
*{box-sizing:border-box}body{margin:0;font:14px Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 260px;gap:16px;max-width:1300px;margin:0 auto;padding:16px}
.p{background:var(--card);border-radius:24px;padding:18px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
h1,h2,h3{margin:0;font-weight:600}h1{font-size:22px}h2{font-size:17px}.m{color:var(--mut);font-size:13px}
.nv{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;border:0;border-radius:14px;background:none;color:var(--mut);font:inherit;cursor:pointer;margin:4px 0;transition:.2s}
.nv:hover{background:var(--soft);color:var(--b)}.nv.on{background:var(--b);color:#fff}
.bt{background:var(--b);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer;transition:.2s}.bt:hover{transform:translateY(-2px)}.bt.l{background:var(--soft);color:var(--b)}
.bt:focus-visible,.nv:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.hero{background:linear-gradient(120deg,var(--b),#5B7CFA);color:#fff;border-radius:24px;padding:26px;margin:14px 0}.hero .bt{background:var(--c);color:#fff;margin-top:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.st{background:var(--soft);border-radius:16px;padding:14px}.st b{font-size:24px;display:block}
.cy{background:linear-gradient(135deg,#38BDF8,#4DA8F7);color:#fff;border-radius:20px;padding:16px}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .5s}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:0;border-radius:12px;padding:10px 12px;width:100%}textarea{min-height:90px}
.v>*{animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.paper{background:#FFFEF7;color:#1d2a5b;border-radius:14px;padding:20px 20px 20px 56px;min-height:380px;font:500 24px/32px Caveat,cursive;background-image:repeating-linear-gradient(transparent 0 31px,#cfe0ff 31px 32px);border-left:3px solid #f5a3a3;outline:0;transform-origin:left}
.paper h3{font:700 32px/40px Caveat,cursive;color:var(--b)}.paper ul{margin:0;padding-left:20px}.flip{animation:fl .5s}@keyframes fl{from{transform:perspective(900px) rotateY(-70deg);opacity:.2}}
.chip{padding:6px 12px;border-radius:20px;background:var(--soft);color:var(--b);border:0;font:inherit;cursor:pointer;font-size:13px}.chip.on{background:var(--b);color:#fff}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;border-radius:14px;border:2px solid var(--soft);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:.2s}.o:hover{border-color:var(--c)}
.o.ok{background:#DCFCE7;border-color:var(--ok);color:#14532d}.o.no{background:#FEE2E2;border-color:var(--bad);color:#7f1d1d;animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pw{width:44px;height:44px;border-radius:50%;background:var(--c) center/cover;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:600}
.pin{display:inline-block;width:62px;height:28px;border-radius:6px;margin:3px;color:#000;font-size:11px;text-align:center;line-height:28px}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:16px}pre{background:var(--soft);border-radius:12px;padding:12px;white-space:pre-wrap;min-height:60px}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;gap:4px}.side .nv{width:auto;white-space:nowrap}.lg{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><aside class="p side"><div class="lg" style="font-size:20px;font-weight:600;color:var(--b);margin:4px 0 14px">LGVIBE</div><div id="nav" class="row" style="display:contents"></div></aside>
<main><div class="p"><div class="row"><div><div class="m" id="sub"></div><h1 id="hi"></h1></div><div class="sp"></div><select id="cs" style="max-width:260px" onchange="ci=+this.value;ti=0;qs=null;R()"></select></div></div><div id="view" class="v"></div></main>
<aside class="p" id="rt"></aside></div>
<script>
const D=[{id:'net',name:'Data Communication and Networking',code:'ICTEW 353',type:'net',topics:[
{t:'Data communication',n:['Data communication is the exchange of data between two devices through a transmission medium.','Telecommunication means communication at a distance.','Delivery means data must reach the correct destination only.','Accuracy means data must arrive without errors.','Timeliness means data must arrive without significant delay.','Jitter is the variation in packet arrival time.']},
{t:'Components of a system',n:['The message is the information that is sent.','The sender is the device that sends the message.','The receiver is the device that receives the message.','The transmission medium is the physical path a message travels.','A protocol is a set of rules that governs data communication.']},
{t:'Data flow',n:['Simplex communication is unidirectional.','Half-duplex lets each station transmit and receive but not at the same time.','Walkie-talkies are an example of half-duplex communication.','Full-duplex lets both stations transmit and receive simultaneously.','Phone calls are an example of full-duplex communication.']},
{t:'Network criteria',n:['Performance is measured by throughput and delay.','Reliability is measured by frequency of failure and recovery time.','Security means protecting data from unauthorized access.','A network is a set of nodes connected by communication links.']},
{t:'Physical topologies',n:['Physical topology describes how a network is laid out.','The four basic topologies are mesh, star, bus, and ring.','A mesh topology with n devices needs n(n-1)/2 links.','In a star topology every device connects to a central hub.','A bus topology uses one shared backbone cable.','In a ring topology each device connects to two neighbors.']},
{t:'Protocols and standards',n:['A protocol is a set of rules for data communication.','Syntax refers to the structure or format of the data.','Semantics refers to the meaning of each section of bits.','Timing refers to when data is sent and how fast.','Standards are either de facto or de jure.']},
{t:'Analog and digital',n:['Analog data takes continuous values.','Digital data takes discrete values.','Analog signals have infinitely many levels of intensity.','Digital signals have a limited number of defined values.','Data must be transformed into electromagnetic signals to be transmitted.']}]}];
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let courses=ld('lg_c',D),nt=ld('lg_n',{}),pr=ld('lg_p',{}),av=ld('lg_av',''),ci=0,ti=0,tab='home',adm=false,qs=null,fl='',ps='topo',fail=false,cab='B';
const cur=()=>courses[ci],key=(i=ti)=>cur().id+':'+i,H=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);
const NAV=[['home','Dashboard'],['notes','Notes'],['play','Playground'],['quiz','Quiz'],['tutor','Tutor me'],['admin','Admin']];
const yid=u=>((u||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/)||[])[1];
function gen(c,i){const pool=[...new Set(c.topics.flatMap(t=>t.n.join(' ').match(/[A-Za-z-]{6,}/g)||[]))],q=[];
 c.topics[i].n.forEach(s=>{const w=(s.match(/[A-Za-z-]{6,}/g)||[]).sort((a,b)=>b.length-a.length)[0];if(!w)return;const d=pool.filter(x=>x.toLowerCase()!=w.toLowerCase()).sort((a,b)=>H(a+s)-H(b+s)).slice(0,3),o=[w,...d].sort((a,b)=>H(a+s+'x')-H(b+s+'x'));q.push({q:s.replace(w,'_____'),o,a:w})});return q}
function go(t){tab=t;R()}function pg(n){const l=cur().topics.length;ti=(n+l)%l;fl='flip';qs=null;R();fl=''}
function R(){const h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 $('hi').textContent=g+(adm?', Mr. Lord':'');$('sub').textContent=adm?'Admin desk':'Welcome back';
 $('cs').innerHTML=courses.map((c,i)=>`<option value="${i}" ${i==ci?'selected':''}>${E(c.name)}</option>`).join('');
 $('nav').innerHTML=NAV.map(n=>`<button class="nv ${tab==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
 $('view').innerHTML=({home,notes,play,quiz,tutor,admin})[tab]();$('view').style.animation='none';$('view').offsetWidth;$('view').style.animation='';if(tab=='play'&&ps=='time'&&cur().type=='net')tm();
 const c=cur(),d=c.topics.filter((t,i)=>(pr[key(i)]||{}).done).length,pc=Math.round(d/c.topics.length*100);
 $('rt').innerHTML=`<div class="row"><div class="pw" onclick="$('#up').click()" style="${av?`background-image:url(${av})`:''}">${av?'':adm?'ML':'S'}</div><div><b>${adm?'Mr. Lord':'Student'}</b><div class="m">${adm?'Administrator':'Learner'}</div></div></div><input type="file" id="up" accept="image/*" hidden onchange="pic(this)"><h2 style="margin:20px 0 10px">My progress</h2><div class="cy"><div class="m" style="color:#fff">Topics completed</div><div style="font-size:28px;font-weight:600">${d} / ${c.topics.length}</div><div class="bar" style="margin-top:8px"><i style="width:${pc}%;background:#fff"></i></div></div><h2 style="margin:20px 0 10px">Topics</h2>`+c.topics.map((t,i)=>`<div class="row" style="padding:8px 0;cursor:pointer" onclick="ti=${i};qs=null;go('notes')"><span style="width:10px;height:10px;border-radius:50%;background:${(pr[key(i)]||{}).done?'var(--ok)':'var(--soft)'}"></span><span class="m" style="color:var(--ink)">${E(t.t)}</span></div>`).join('')}
function pic(f){const r=new FileReader();r.onload=()=>{av=r.result;sv('lg_av',av);R()};f.files[0]&&r.readAsDataURL(f.files[0])}
function home(){const c=cur(),n=c.topics.length;return `<div class="hero"><h2 style="font-size:22px">Easy to learn ${E(c.name)}</h2><p>${E(c.code)} · ${n} topics with notes, a playground, quizzes and videos.</p><button class="bt" onclick="go('notes')">Open notes</button></div><div class="g">`+c.topics.map((t,i)=>{const p=pr[key(i)]||{},pc=p.n?Math.round(p.c/p.n*100):0;return `<div class="p" style="cursor:pointer" onclick="ti=${i};qs=null;go('quiz')"><h2>${E(t.t)}</h2><div class="m" style="margin:6px 0 10px">${p.n?'Quiz score '+pc+'%':'Not attempted'}</div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join('')+`</div>`}
function notes(){const c=cur(),t=c.topics[ti],body=nt[key()]||`<h3>${E(t.t)}</h3><ul>${t.n.map(s=>'<li>'+E(s)+'</li>').join('')}</ul>`;
 return `<div class="p" style="margin-top:14px"><div class="row" style="margin-bottom:12px"><button class="bt l" onclick="pg(ti-1)">Prev page</button><b>Page ${ti+1} of ${c.topics.length}</b><button class="bt l" onclick="pg(ti+1)">Next page</button><div class="sp"></div><button class="chip" onmousedown="event.preventDefault();document.execCommand('bold')">Bold</button><button class="chip" onmousedown="event.preventDefault();document.execCommand('hiliteColor',false,'#FDE68A')">Highlight</button><button class="chip" onmousedown="event.preventDefault();document.execCommand('foreColor',false,'#DC2626')">Red pen</button><button class="chip" onclick="delete nt[key()];sv('lg_n',nt);R()">Reset page</button></div><div id="pg" class="paper ${fl}" contenteditable="true" oninput="nt[key()]=this.innerHTML;sv('lg_n',nt)">${body}</div><div class="m" style="margin-top:8px">Click the page to write. Your edits save on this device.</div></div>`}
function play(){const c=cur();if(c.type=='code')return `<div class="p" style="margin-top:14px"><h2>Code playground</h2><p class="m">JavaScript runs here. Other languages need a compiler such as Java on your computer.</p><textarea id="cd" style="min-height:160px;font-family:monospace">console.log("Hello from LGVIBE")</textarea><div style="margin:10px 0"><button class="bt" onclick="runc()">Run code</button></div><pre id="out"></pre></div>`;
 if(c.type!='net')return `<div class="p" style="margin-top:14px"><h2>Playground</h2><p class="m">The admin has not added a simulation for this course yet.</p></div>`;
 const tabs=[['topo','Topologies'],['time','Timing'],['cab','Cables']].map(x=>`<button class="chip ${ps==x[0]?'on':''}" onclick="ps='${x[0]}';fail=false;R()">${x[1]}</button>`).join(' ');
 return `<div class="p" style="margin-top:14px"><div class="row" style="margin-bottom:12px">${tabs}</div>${ps=='topo'?topo():ps=='time'?timing():cables()}</div>`}
const TP=['star','mesh','bus','ring'];let tp='star';
function topo(){const P=[0,1,2,3,4].map(i=>{const a=(-90+72*i)*Math.PI/180;return[300+95*Math.cos(a),130+95*Math.sin(a)]}),L=[];
 const ln=(a,b,x)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${x?'#DC2626':'#8da2ff'}" stroke-width="2.5" ${x?'stroke-dasharray="6 5"':''}/>`;let s='',info,cab;
 if(tp=='star'){P.forEach(p=>s+=ln(p,[300,130],fail));cab=5;info=fail?'The hub failed, so every device is cut off. The hub is the single point of failure.':'Every device links to a central hub. Easy to add devices, but the hub is critical.'}
 if(tp=='mesh'){for(let i=0;i<5;i++)for(let j=i+1;j<5;j++)s+=ln(P[i],P[j],fail&&i==0&&j==2);cab=10;info=fail?'Link A-C is down but traffic reroutes through B. Meshes survive failures.':'Every pair has its own link: n(n-1)/2 = 10 links for 5 devices.'}
 if(tp=='bus'){P.forEach((p,i)=>{p[0]=80+i*110;p[1]=60;s+=ln(p,[p[0],150],0)});s+=ln([60,150],[fail?260:560,150],0)+(fail?ln([260,150],[300,150],1)+ln([300,150],[560,150],0):'');cab=1;info=fail?'The backbone is cut, so the network splits in two.':'All devices share one backbone cable. Cheap, but one break affects everyone.'}
 if(tp=='ring'){P.forEach((p,i)=>s+=ln(p,P[(i+1)%5],fail&&(i==0||i==1)));cab=5;info=fail?'Device B failed and the ring is broken (unless it is a dual ring).':'Each device connects to two neighbours and relays packets around the ring.'}
 s+=P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="20" fill="${fail&&tp=='ring'&&i==1?'#DC2626':'#4361EE'}"/><text x="${p[0]}" y="${p[1]+5}" fill="#fff" text-anchor="middle" font-size="14">${'ABCDE'[i]}</text>`).join('');
 if(tp=='star')s+=`<circle cx="300" cy="130" r="24" fill="${fail?'#DC2626':'#38BDF8'}"/><text x="300" y="135" fill="#fff" text-anchor="middle" font-size="13">Hub</text>`;
 return `<div class="row" style="margin-bottom:10px">${TP.map(x=>`<button class="chip ${tp==x?'on':''}" onclick="tp='${x}';fail=false;R()">${x}</button>`).join('')}<div class="sp"></div><button class="bt" onclick="fail=!fail;R()">${fail?'Repair':'Simulate failure'}</button></div><svg viewBox="0 0 600 250" width="100%" role="img" aria-label="${tp} topology"><title>${tp} topology</title>${s}</svg><p><b>${cab}</b> cables or links. ${info}</p>`}
function timing(){return `<h2>Protocol timing</h2><p class="m">If the sender is faster than the receiver, data is lost.</p><div class="row"><span style="width:110px">Sender speed</span><input type="range" id="s1" min="1" max="100" value="100" oninput="tm()" style="flex:1"><b id="a1"></b></div><div class="row" style="margin-top:8px"><span style="width:110px">Receiver speed</span><input type="range" id="s2" min="1" max="100" value="1" oninput="tm()" style="flex:1"><b id="a2"></b></div><div class="g" style="margin-top:14px"><div class="st">Lost per second<b id="lo"></b></div><div class="st">Share lost<b id="pc"></b></div></div>`}
function tm(){const a=+$('#s1').value,b=+$('#s2').value,l=Math.max(0,a-b);$('#a1').textContent=a+' Mbps';$('#a2').textContent=b+' Mbps';$('#lo').textContent=l+' Mbps';$('#pc').textContent=Math.round(l/a*100)+'%';$('#pc').style.color=l?'var(--bad)':'var(--ok)'}
function cables(){const A=['wg','g','wo','bl','wbl','o','wbr','br'],B=['wo','o','wg','bl','wbl','g','wbr','br'],C={o:['Orange','#F59E0B'],g:['Green','#22C55E'],bl:['Blue','#3B82F6'],br:['Brown','#92400E']},o=cab=='A'?A:B;
 return `<div class="row" style="margin-bottom:10px"><button class="chip ${cab=='A'?'on':''}" onclick="cab='A';R()">T568A</button><button class="chip ${cab=='B'?'on':''}" onclick="cab='B';R()">T568B</button></div><p class="m">RJ45 pin order, pin 1 to pin 8:</p>`+o.map((k,i)=>{const w=k[0]=='w',x=C[w?k.slice(1):k];return `<span class="pin" style="background:${w?`repeating-linear-gradient(90deg,#fff 0 8px,${x[1]} 8px 16px)`:x[1]}">${i+1}</span>`}).join('')+`<p>${cab=='B'?'Straight-through cables use T568B on both ends. A crossover uses T568A on one end and T568B on the other.':'T568A swaps the orange and green pairs compared with T568B.'}</p>`}
function runc(){const L=[];const lg=console.log;console.log=(...a)=>L.push(a.join(' '));try{new Function($('#cd').value)()}catch(e){L.push('Error: '+e.message)}console.log=lg;$('#out').textContent=L.join('\n')||'(no output)'}
function quiz(){const c=cur(),q=gen(c,ti);if(!qs||qs.k!=key())qs={k:key(),i:0,s:null,sc:0,ans:0};
 const chips=c.topics.map((t,i)=>`<button class="chip ${i==ti?'on':''}" onclick="ti=${i};qs=null;R()">${E(t.t)}</button>`).join(' ');
 let b;if(qs.i>=q.length){const pc=Math.round(qs.sc/q.length*100);b=`<h2>Topic report</h2><div class="g" style="margin:12px 0"><div class="st">Score<b>${qs.sc}/${q.length}</b></div><div class="st">Percent<b style="color:${pc>=50?'var(--ok)':'var(--bad)'}">${pc}%</b></div><div class="st">Answered<b>${qs.ans}</b></div></div><button class="bt" onclick="qs=null;R()">Retake</button> <button class="bt l" onclick="pg(ti+1)">Next topic</button>`}
 else{const x=q[qs.i];b=`<div class="row"><b>Question ${qs.i+1} of ${q.length}</b><div class="sp"></div><span class="m">Answered ${qs.ans} · Remaining ${q.length-qs.ans}</span></div><div class="bar" style="margin:8px 0 16px"><i style="width:${qs.ans/q.length*100}%"></i></div><p style="font-size:16px">Fill the blank: ${E(x.q)}</p>`+x.o.map((o,j)=>`<button class="o ${qs.s!=null?(o==x.a?'ok':qs.s==j?'no':''):''}" ${qs.s!=null?'disabled':''} onclick="pick(${j})">${E(o)}</button>`).join('')+(qs.s!=null?`<button class="bt" onclick="qs.i++;qs.s=null;fin();R()">${qs.i+1==q.length?'See report':'Next question'}</button>`:'')}
 const rep=c.topics.map((t,i)=>{const p=pr[key(i)]||{},pc=p.n?Math.round(p.c/p.n*100):0;return `<div class="row" style="padding:6px 0"><span style="width:180px">${E(t.t)}</span><div class="bar sp"><i style="width:${pc}%;background:${pc>=50?'var(--ok)':'var(--bad)'}"></i></div><span class="m">${p.n?pc+'%':'-'}</span></div>`}).join('');
 return `<div class="p" style="margin-top:14px"><div class="row" style="margin-bottom:14px">${chips}</div>${b}</div><div class="p" style="margin-top:14px"><h2 style="margin-bottom:8px">Course report</h2>${rep}</div>`}
function pick(j){const q=gen(cur(),ti)[qs.i];qs.s=j;qs.ans++;if(q.o[j]==q.a)qs.sc++;R()}
function fin(){const n=gen(cur(),ti).length;if(qs.i>=n){pr[key()]={...(pr[key()]||{}),n,c:qs.sc,done:1};sv('lg_p',pr)}}
function tutor(){const c=cur(),t=c.topics[ti],id=yid(t.v),sq='https://www.youtube.com/results?search_query='+encodeURIComponent(c.name+' '+t.t);
 return `<div class="p" style="margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px"><div><h2 style="margin-bottom:10px">${E(t.t)}</h2>${id?`<iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen title="Video lesson"></iframe>`:`<div class="cy" style="aspect-ratio:16/9;display:grid;place-items:center;text-align:center">No video linked for this topic yet.<br>Search YouTube for lessons.</div>`}<div class="row" style="margin-top:12px"><a class="bt" style="text-decoration:none" target="_blank" rel="noopener" href="${sq}">Find on YouTube</a><button class="bt l" onclick="pr[key()]={...(pr[key()]||{}),vid:1};sv('lg_p',pr);R()">${(pr[key()]||{}).vid?'Watched':'Mark as watched'}</button></div></div><div>`+c.topics.map((x,i)=>`<button class="nv ${i==ti?'on':''}" onclick="ti=${i};R()">${(pr[key(i)]||{}).vid?'✓ ':''}${E(x.t)}</button>`).join('')+`</div></div>`}
function admin(){if(!adm)return `<div class="p" style="margin-top:14px;max-width:360px"><h2>Admin login</h2><p class="m">Enter the admin password.</p><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key=='Enter')lg()"><div id="er" class="m" style="color:var(--bad);min-height:20px"></div><button class="bt" onclick="lg()">Sign in</button></div>`;
 const tt=courses.reduce((a,c)=>a+c.topics.length,0),vv=courses.reduce((a,c)=>a+c.topics.filter(t=>yid(t.v)).length,0),qz=Object.values(pr).filter(p=>p.n).length,c=cur();
 return `<div class="hero"><h2 style="font-size:22px">Good ${new Date().getHours()<12?'morning':'day'}, Mr. Lord. Your desk is ready.</h2><p>You have ${courses.length} courses live. Tutor me has videos for ${vv} of ${tt} topics.</p><button class="bt" onclick="document.getElementById('nc').scrollIntoView({behavior:'smooth'})">Add a course</button></div><div class="g"><div class="st">Courses<b>${courses.length}</b></div><div class="st">Topics<b>${tt}</b></div><div class="st">Quizzes taken<b>${qz}</b></div><div class="st">Videos linked<b>${vv}/${tt}</b></div></div>
 <div class="p" style="margin-top:14px"><div class="row"><h2>Tutor me videos: ${E(c.name)}</h2><div class="sp"></div><button class="bt l" onclick="if(courses.length>1){courses.splice(ci,1);ci=0;sv('lg_c',courses);R()}else alert('Keep at least one course.')">Delete course</button></div>`+c.topics.map((t,i)=>`<div class="row" style="margin-top:8px"><span style="width:170px">${E(t.t)}</span><input class="sp" placeholder="YouTube link" value="${E(t.v||'')}" onchange="cur().topics[${i}].v=this.value;sv('lg_c',courses);R()"></div>`).join('')+`</div>
 <div class="p" id="nc" style="margin-top:14px"><h2>Add a course</h2><p class="m">One topic per line as: Topic title :: notes sentences :: YouTube link (optional). Notes, quiz, tutor me and playground update automatically.</p><div class="row" style="margin:10px 0"><input id="cn" placeholder="Course name" class="sp"><input id="cc" placeholder="Code" style="max-width:120px"><select id="ct" style="max-width:150px"><option value="other">Theory</option><option value="code">Coding</option><option value="net">Networking</option></select></div><textarea id="tp" style="min-height:140px" placeholder="Variables :: A variable stores a value. Java is a typed language. :: https://youtu.be/xxxxxxxxxxx"></textarea><div style="margin-top:10px"><button class="bt" onclick="addc()">Create course</button> <button class="bt l" onclick="adm=false;go('home')">Sign out</button></div></div><p class="m" style="margin-top:12px">Note: this login runs in the browser, so it keeps casual users out but is not bank-grade security.</p>`}
function lg(){if($('#pw').value=='@12345@'){adm=true;R()}else $('#er').textContent='Wrong password. Try again.'}
function addc(){const n=$('#cn').value.trim(),tp=$('#tp').value.split('\n').map(l=>l.split('::').map(x=>x.trim())).filter(a=>a[0]&&a[1]).map(a=>({t:a[0],n:a[1].split(/(?<=[.!?])\s+/).filter(Boolean),v:a[2]||''}));
 if(!n||!tp.length){alert('Add a course name and at least one topic line.');return}courses.push({id:'c'+Date.now(),name:n,code:$('#cc').value||'NEW',type:$('#ct').value,topics:tp});ci=courses.length-1;ti=0;sv('lg_c',courses);go('home')}
R();
</script></body></html>
